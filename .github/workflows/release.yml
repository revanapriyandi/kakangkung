name: Release

# A tag "v1.2.3" builds every supported platform, makes the installers and portable zips,
# writes SHA256SUMS.txt and publishes the GitHub release that the built-in updater reads.
# "Run workflow" (manual) builds the same files as a dry run and keeps them as artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on a dry-run build (empty = the one in Cargo.toml)
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Version
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
            if ($v -ne $cargo) { throw "Tag v$v does not match the version in Cargo.toml ($cargo)" }
          } elseif ('${{ inputs.version }}') { $v = '${{ inputs.version }}' } else { $v = $cargo }
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          "Building Kakangkung $v for ${{ matrix.arch }}"

      - name: Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The Google OAuth client ("Sign in with Google") is built into kakangkung.exe from these
      # secrets (see docs/GOOGLE_SIGNIN.md); without them the build has no Google sign-in.
      - name: Build
        env:
          KAKANGKUNG_GOOGLE_CLIENT_ID: ${{ secrets.KAKANGKUNG_GOOGLE_CLIENT_ID }}
          KAKANGKUNG_GOOGLE_CLIENT_SECRET: ${{ secrets.KAKANGKUNG_GOOGLE_CLIENT_SECRET }}
        # KB-38: page engine host must ship beside kakangkung.exe (v0.4.4 was ~5 MB exe-only).
        run: cargo build --release --locked --target ${{ matrix.target }} -p app -p ladybird-host

      # Optional: Windows Lagom/LibWeb runtime archive (Boat or offline build). Without it the
      # Rust host still ships so tabs are not host-missing; full LibWeb needs this URL.
      - name: Fetch Ladybird runtime (optional)
        shell: pwsh
        env:
          LADYBIRD_RUNTIME_URL: ${{ secrets.LADYBIRD_RUNTIME_URL }}
        run: |
          if (-not $env:LADYBIRD_RUNTIME_URL) {
            'No LADYBIRD_RUNTIME_URL secret — packaging host only (see docs/RELEASING.md KB-38).'
            return
          }
          $zip = Join-Path $env:RUNNER_TEMP 'ladybird-runtime.zip'
          $out = Join-Path $env:RUNNER_TEMP 'ladybird-runtime'
          Invoke-WebRequest -Uri $env:LADYBIRD_RUNTIME_URL -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          "LADYBIRD_RUNTIME_DIR=$out" | Out-File -Append $env:GITHUB_ENV
          Get-ChildItem -Recurse $out | Select-Object -First 20 FullName

      - name: Bundle Ladybird into bin dir
        shell: pwsh
        run: ./installer/bundle-ladybird.ps1 -BinDir target\${{ matrix.target }}\release

      # Signs kakangkung.exe, Setup and the uninstaller when the SIGN_PFX_BASE64 and
      # SIGN_PFX_PASSWORD secrets exist (see docs/RELEASING.md); unsigned otherwise.
      - name: Installer
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: ./installer/build.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }} -BinDir target\${{ matrix.target }}\release

      # After the installer, so the zip holds the same (signed) program file + host (+ runtime).
      - name: Portable zip
        shell: pwsh
        run: |
          $bin = "target\${{ matrix.target }}\release"
          $stage = Join-Path $env:RUNNER_TEMP "portable-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$bin\kakangkung.exe" $stage
          Copy-Item "$bin\kakangkung-ladybird-host.exe" $stage
          if (Test-Path "$bin\ladybird-runtime") {
            Copy-Item -Recurse "$bin\ladybird-runtime" (Join-Path $stage 'ladybird-runtime')
          }
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.md $stage
          Copy-Item assets\filterlists\LICENSE-MPL-2.0.txt, assets\filterlists\LICENSE-CC-BY-SA-3.0.txt $stage
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\Kakangkung-$env:VERSION-${{ matrix.arch }}.zip" -Force
          Get-Item "dist\Kakangkung-$env:VERSION-${{ matrix.arch }}.zip" |
            ForEach-Object { "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Installer smoke test
        if: matrix.arch == 'x64'
        shell: pwsh
        run: ./installer/smoke-test.ps1 -Setup "dist\Kakangkung-Setup-$env:VERSION-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: kakangkung-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kakangkung-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Kakangkung ${{ github.ref_name }}" \
            --generate-notes --verify-tag

      - name: Dry-run files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: kakangkung-release-dry-run
          path: dist/*
