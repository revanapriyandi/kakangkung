name: Release

# A tag "v1.2.3" builds every supported platform, makes the installers and portable zips,
# writes SHA256SUMS.txt and publishes the GitHub release that the built-in updater reads.
# "Run workflow" (manual) builds the same files as a dry run and keeps them as artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on a dry-run build (empty = the one in Cargo.toml)
        required: false

permissions:
  contents: write
  # Download the LibWeb runtime artifact of the Ladybird runtime workflow.
  actions: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Version
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
            if ($v -ne $cargo) { throw "Tag v$v does not match the version in Cargo.toml ($cargo)" }
          } elseif ('${{ inputs.version }}') { $v = '${{ inputs.version }}' } else { $v = $cargo }
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV
          "Building Kakangkung $v for ${{ matrix.arch }}"

      - name: Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The Google OAuth client ("Sign in with Google") is built into kakangkung.exe from these
      # secrets (see docs/GOOGLE_SIGNIN.md); without them the build has no Google sign-in.
      - name: Build
        env:
          KAKANGKUNG_GOOGLE_CLIENT_ID: ${{ secrets.KAKANGKUNG_GOOGLE_CLIENT_ID }}
          KAKANGKUNG_GOOGLE_CLIENT_SECRET: ${{ secrets.KAKANGKUNG_GOOGLE_CLIENT_SECRET }}
        # KB-38: page engine host must ship beside kakangkung.exe (v0.4.4 was ~5 MB exe-only).
        run: cargo build --release --locked --target ${{ matrix.target }} -p app -p ladybird-host

      # Required: the LibWeb runtime (host + Lagom DLLs + WebContent… + share/Lagom) from the
      # latest green "Ladybird runtime (Windows)" run on main. No runtime, no release: a package
      # with only the stub host installs a browser that cannot show web pages.
      # The x64 runtime also goes into the arm64 package (Windows on ARM runs it emulated).
      - name: Fetch LibWeb runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LADYBIRD_RUNTIME_URL: ${{ secrets.LADYBIRD_RUNTIME_URL }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'ladybird-runtime'
          $zip = Join-Path $env:RUNNER_TEMP 'ladybird-runtime-windows-x64.zip'
          if ($env:LADYBIRD_RUNTIME_URL) {
            Invoke-WebRequest -Uri $env:LADYBIRD_RUNTIME_URL -OutFile $zip
          } else {
            $run = gh run list --repo $env:GITHUB_REPOSITORY --workflow ladybird-windows.yml --branch main `
              --status success --limit 1 --json databaseId --jq '.[0].databaseId'
            if (-not $run) { throw 'No green "Ladybird runtime (Windows)" run on main: build the LibWeb runtime first.' }
            "LibWeb runtime from run $run"
            gh run download $run --repo $env:GITHUB_REPOSITORY --name ladybird-runtime-windows-x64 --dir $env:RUNNER_TEMP
            if ($LASTEXITCODE) { throw "downloading the runtime of run $run failed" }
          }
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $hostExe = Join-Path $out 'bin\kakangkung-ladybird-host.exe'
          if (-not (Test-Path $hostExe)) { throw "runtime has no LibWeb host: $hostExe" }
          if (-not (Test-Path (Join-Path $out 'bin\WebContent.exe'))) { throw 'runtime has no WebContent.exe' }
          $mb = [math]::Round((Get-ChildItem -Recurse -File $out | Measure-Object Length -Sum).Sum / 1MB)
          if ($mb -lt 50) { throw "runtime is only $mb MB: not a full LibWeb build" }
          "LibWeb runtime: $mb MB"
          "LADYBIRD_RUNTIME_DIR=$out" | Out-File -Append $env:GITHUB_ENV

      - name: Bundle Ladybird into bin dir
        shell: pwsh
        run: ./installer/bundle-ladybird.ps1 -BinDir target\${{ matrix.target }}\release

      # Signs kakangkung.exe, Setup and the uninstaller when the SIGN_PFX_BASE64 and
      # SIGN_PFX_PASSWORD secrets exist (see docs/RELEASING.md); unsigned otherwise.
      - name: Installer
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: ./installer/build.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }} -BinDir target\${{ matrix.target }}\release

      # After the installer, so the zip holds the same (signed) program file + host (+ runtime).
      - name: Portable zip
        shell: pwsh
        run: |
          $bin = "target\${{ matrix.target }}\release"
          $stage = Join-Path $env:RUNNER_TEMP "portable-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$bin\kakangkung.exe" $stage
          Copy-Item "$bin\kakangkung-ladybird-host.exe" $stage
          if (Test-Path "$bin\ladybird-runtime") {
            Copy-Item -Recurse "$bin\ladybird-runtime" (Join-Path $stage 'ladybird-runtime')
          }
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.md $stage
          Copy-Item assets\filterlists\LICENSE-MPL-2.0.txt, assets\filterlists\LICENSE-CC-BY-SA-3.0.txt $stage
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\Kakangkung-$env:VERSION-${{ matrix.arch }}.zip" -Force
          Get-Item "dist\Kakangkung-$env:VERSION-${{ matrix.arch }}.zip" |
            ForEach-Object { "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      # A package without the LibWeb runtime is a few MB; refuse anything that small.
      - name: Package sizes
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem dist -File) {
            $mb = [math]::Round($f.Length / 1MB, 1)
            "$($f.Name)  $mb MB"
            if ($f.Extension -in '.exe', '.zip' -and $mb -lt 50) { throw "$($f.Name) is only $mb MB: the LibWeb runtime is missing" }
          }

      # Installs the setup, runs the installed Kakangkung through the LibWeb smoke test (no console
      # window, self-test green, LibWeb host used), then uninstalls it.
      - name: Installer smoke test
        if: matrix.arch == 'x64'
        shell: pwsh
        run: ./installer/smoke-test.ps1 -Setup "dist\Kakangkung-Setup-$env:VERSION-x64.exe" -RequireLibWeb

      - name: Smoke test screenshots
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-x64
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/kakangkung-stderr.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: kakangkung-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # B5: Linux Ladybird host package (not the Win32 app chrome — that stays Windows-only).
  # Full LibWeb/Lagom attach via Boat package-runtime.sh → attach as release asset separately
  # or set LADYBIRD_RUNTIME_URL once a Linux runtime tarball is published.
  linux-host:
    name: Linux ladybird-host (x64)
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins stable-x86_64-pc-windows-msvc for the Windows app; on Linux
      # that channel name fails `rustc -vV`. Use the runner's native stable instead.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${{ github.ref_type }}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            if [ "$v" != "$cargo" ]; then
              echo "Tag v$v does not match Cargo.toml ($cargo)" >&2
              exit 1
            fi
          elif [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            v="$cargo"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Building kakangkung-ladybird-host $v (Linux x64)"

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-ladybird-host

      - name: Build ladybird-host
        run: cargo build --release --locked -p ladybird-host

      - name: Package
        run: |
          mkdir -p dist stage
          cp target/release/kakangkung-ladybird-host stage/
          cp LICENSE README.md THIRD_PARTY_NOTICES.md stage/ 2>/dev/null || true
          printf '%s\n' \
            'Kakangkung Ladybird host (Linux x64)' \
            "Version: $VERSION" \
            '' \
            'This is the page-engine host binary, not the full Win32 Kakangkung UI.' \
            'Pair with a Lagom runtime from Boat (engines/ladybird/package-runtime.sh)' \
            'or set KAKANGKUNG_LADYBIRD_HOST to this binary.' \
            '' \
            'macOS: full app + host packaging is not in this workflow yet (native chrome' \
            'is Win32/Direct2D; macOS port tracked as B5 blocker).' \
            > stage/README-LINUX-HOST.txt
          tar -C stage -czf "dist/kakangkung-ladybird-host-${VERSION}-linux-x64.tgz" .
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: kakangkung-linux-host
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, linux-host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kakangkung-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Kakangkung ${{ github.ref_name }}" \
            --generate-notes --verify-tag

      - name: Dry-run files
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: kakangkung-release-dry-run
          path: dist/*
