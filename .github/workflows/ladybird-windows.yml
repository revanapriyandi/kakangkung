name: Ladybird runtime (Windows)

# Builds upstream Ladybird / LibWeb natively on Windows (clang-cl, with Ladybird's own setup and
# cache actions, as its Windows CI does), builds kakangkung-ladybird-host inside that CMake tree
# (engines/ladybird, HAVE_LADYBIRD=ON) and uploads ladybird-runtime-windows-x64.zip:
#
#   bin/    kakangkung-ladybird-host.exe, Lagom DLLs, helper processes (WebContent, …), vcpkg DLLs
#   share/  Lagom resources
#
# The app prefers <install dir>\ladybird-runtime\bin\kakangkung-ladybird-host.exe over the stub.
# Upstream's Windows port is experimental: a build that links can still crash at run time.

on:
  workflow_dispatch:
    inputs:
      ladybird_ref:
        description: LadybirdBrowser/ladybird commit (pinned; LibWebView's API moves fast)
        required: false
        default: 48d36b1709f6fbac372f4282c1dc5c67c12e238f
  push:
    branches: [main]
    paths:
      - engines/ladybird/**
      - crates/engine/**
      - .github/workflows/ladybird-windows.yml

permissions:
  contents: read

concurrency:
  group: ladybird-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Build LibWeb + host (Windows x64)
    # Not windows-latest: its Visual Studio 18 STL (MSVC 14.52) refuses clang-cl < 22, and
    # Ladybird's setup action installs LLVM 20. VS 2022's STL accepts it.
    runs-on: windows-2022
    # GitHub-hosted jobs stop at 6 h; a cold Ladybird build takes about 2 h.
    timeout-minutes: 355
    defaults:
      run:
        shell: pwsh
    env:
      LADYBIRD_REF: ${{ inputs.ladybird_ref || '48d36b1709f6fbac372f4282c1dc5c67c12e238f' }}
      LADYBIRD_SOURCE_DIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_ROOT: ${{ github.workspace }}/Build/vcpkg-release
      CCACHE_COMPILERCHECK: "%compiler% -v"
    steps:
      # Ladybird at the workspace root: its setup / cache actions expect that.
      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ env.LADYBIRD_REF }}

      - name: Checkout Kakangkung
        uses: actions/checkout@v4
        with:
          path: kakangkung

      - name: Set up environment (Ladybird)
        uses: ./.github/actions/setup
        with:
          os: Windows
          arch: x86_64
          toolchain: ClangCL

      # windows-2022 lacks ccache and ninja on PATH (the 2025 image Ladybird targets has them).
      - name: Install ccache and ninja
        run: |
          choco install -y ccache ninja --no-progress
          if ($LASTEXITCODE) { throw "choco install failed ($LASTEXITCODE)" }
          ccache --version | Select-Object -First 1; ninja --version

      - name: Restore caches (Ladybird)
        id: cache-restore
        uses: ./.github/actions/cache-restore
        with:
          os: Windows
          arch: x86_64
          toolchain: ClangCL
          cache_key_extra: Kakangkung_Windows
          ccache_path: ${{ env.CCACHE_DIR }}
          sccache_path: ${{ github.workspace }}/.sccache
          vcpkg_cache_path: ${{ github.workspace }}/Build/caches/vcpkg-binary-cache

      - name: Add the Kakangkung host to Ladybird's CMake tree
        run: |
          $lines = @(
            '',
            '# Kakangkung: build kakangkung-ladybird-host against the in-tree LibWebView.',
            'set(HAVE_LADYBIRD ON CACHE BOOL "" FORCE)',
            'add_subdirectory("${CMAKE_SOURCE_DIR}/kakangkung/engines/ladybird" kakangkung-host)'
          )
          Add-Content -Path CMakeLists.txt -Value $lines
          Get-Content CMakeLists.txt -Tail 5

      - name: Configure
        run: |
          # LADYBIRD_BASELINE_CPU_TARGET: x86-64-v2 for C++ and Rust. Without it Ladybird builds
          # with -march=native / -Ctarget-cpu=native, i.e. for the runner's CPU, and the runtime can
          # die with "illegal instruction" on users' PCs. (ENABLE_CI_BASELINE_CPU is its old name.)
          # No /Zi: ccache cannot cache compiles that write a PDB (all 2726 were uncacheable);
          # Ladybird adds /Z7 itself.
          cmake --preset Release -B Build `
            -DLADYBIRD_BASELINE_CPU_TARGET=ON `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            "-DCMAKE_C_FLAGS_RELWITHDEBINFO=/O2 /Ob1 /DNDEBUG" `
            "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=/O2 /Ob1 /DNDEBUG" `
            -DENABLE_TESTS=OFF `
            -DBUILD_TESTING=OFF `
            -DENABLE_LAGOM_TESTS=OFF

      # A runtime built for the runner's CPU must never ship: fail before the 2-hour build.
      - name: Check CPU baseline
        run: |
          $cmds = ninja -C Build -t commands | Out-String
          if ($cmds -match 'march=native|target-cpu=native') { throw 'build targets the runner CPU (-march=native): set LADYBIRD_BASELINE_CPU_TARGET' }
          if ($cmds -notmatch 'march=x86-64-v2') { throw 'no -march=x86-64-v2 in the build commands' }
          'CPU baseline: x86-64-v2'

      # -k 0: keep building Ladybird when the host fails, so the compiler cache holds all of
      # Ladybird and the next run only rebuilds the host.
      - name: Build
        run: |
          cmake --build Build -- -k 0
          if ($LASTEXITCODE) { throw "build failed ($LASTEXITCODE)" }
          cmake --install Build --strip --prefix Install

      - name: Package ladybird-runtime
        run: |
          $rt = Join-Path $env:RUNNER_TEMP 'ladybird-runtime'
          New-Item -ItemType Directory -Force "$rt/bin" | Out-Null
          Copy-Item Install/bin/* "$rt/bin" -Recurse -Force
          if (Test-Path Install/libexec) { Copy-Item Install/libexec/* "$rt/bin" -Force }
          Copy-Item Build/vcpkg_installed/x64-windows/bin/*.dll "$rt/bin" -Force -ErrorAction SilentlyContinue
          if (Test-Path Install/share) { Copy-Item Install/share "$rt/share" -Recurse -Force }
          # Ladybird's own browser UI is not part of Kakangkung.
          Remove-Item "$rt/bin/Ladybird.exe" -ErrorAction SilentlyContinue
          # clang-cl /MD links the Visual C++ runtime. Ship it app-local (Microsoft's documented
          # redistribution) so the host also starts on PCs without the VC++ Redistributable.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -Directory -Filter 'Microsoft.VC*.CRT' |
            Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch 'onecore|debug' } |
            Select-Object -First 1
          if (-not $crt) { throw 'Visual C++ runtime (x64 CRT redist) not found' }
          Copy-Item "$($crt.FullName)\*.dll" "$rt/bin" -Force
          "VC++ runtime from $($crt.FullName):"; Get-ChildItem $crt.FullName -Filter *.dll | ForEach-Object Name
          $host_exe = "$rt/bin/kakangkung-ladybird-host.exe"
          if (-not (Test-Path $host_exe)) {
            $built = Get-ChildItem -Recurse Build -Filter kakangkung-ladybird-host.exe | Select-Object -First 1
            if (-not $built) { throw 'kakangkung-ladybird-host.exe was not built' }
            Copy-Item $built.FullName $host_exe
          }
          # Loads every DLL the host links: fails here, not on a user's machine.
          & $host_exe --version
          if ($LASTEXITCODE) { throw "host --version exited $LASTEXITCODE" }
          Get-ChildItem "$rt/bin" -Filter *.exe | ForEach-Object Name
          Compress-Archive -Path "$rt/*" -DestinationPath ladybird-runtime-windows-x64.zip -Force
          $mb = [math]::Round((Get-Item ladybird-runtime-windows-x64.zip).Length / 1MB, 1)
          "ladybird-runtime-windows-x64.zip: $mb MB (Ladybird $env:LADYBIRD_REF)"

      - name: Upload ladybird-runtime
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-runtime-windows-x64
          path: ladybird-runtime-windows-x64.zip
          if-no-files-found: error

      # Saved here, not with Ladybird's cache-save action: that one only saves on its own
      # refs/heads/master, so on our main every run rebuilt everything (~2.5 h). Saved also after
      # a failed host build, so the next run reuses the compiled Ladybird. Same paths and keys
      # as Ladybird's cache-restore action reads.
      - name: Stop compiler cache servers
        if: always() && steps.cache-restore.outcome == 'success'
        run: |
          ccache --evict-older-than=1d
          ccache -s
          sccache --stop-server 2>$null
          exit 0

      - name: Save ccache
        if: always() && steps.cache-restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-restore.outputs.ccache_primary_key }}

      - name: Save sccache
        if: always() && steps.cache-restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.cache-restore.outputs.sccache_primary_key }}

      - name: Save vcpkg binary cache
        if: always() && steps.cache-restore.outcome == 'success' && steps.cache-restore.outputs.vcpkg_cache_primary_key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/Build/caches/vcpkg-binary-cache
          key: ${{ steps.cache-restore.outputs.vcpkg_cache_primary_key }}

  # Runs Kakangkung with that runtime: the self-test drives the real browser, any console window
  # that opens fails the job, and the screenshots show whether LibWeb really draws the pages.
  smoke:
    name: Kakangkung + LibWeb smoke test (Windows x64)
    needs: runtime
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build Kakangkung
        run: cargo build --release --locked -p app -p ladybird-host

      - name: Install ladybird-runtime
        uses: actions/download-artifact@v4
        with:
          name: ladybird-runtime-windows-x64

      - name: Unpack runtime beside kakangkung.exe
        run: |
          Expand-Archive ladybird-runtime-windows-x64.zip -DestinationPath target\release\ladybird-runtime -Force
          Get-Item target\release\ladybird-runtime\bin\kakangkung-ladybird-host.exe

      - name: Self-test with LibWeb (no console windows allowed)
        timeout-minutes: 10
        run: ./installer/libweb-smoke.ps1 -Exe target/release/kakangkung.exe

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libweb-smoke-screenshots
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/kakangkung-stderr.log
          if-no-files-found: ignore
