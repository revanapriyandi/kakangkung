name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please check the open issues first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: version
    attributes:
      label: Kakangkung version
      description: Settings > About Kakangkung
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and processor
      placeholder: Windows 11 23H2, x64
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options:
        - Installer
        - Portable zip
        - Built from source
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
